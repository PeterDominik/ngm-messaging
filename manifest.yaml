  Other Influnce principles:
    Contrast: Contrast highlight the difference between 2 or more options.
    Take away:
    Percieved value: People will go to greater lengths to get something with a higher perceived value.
    Motivation direction: Imagine its a vector, going from away from pain and negative consequences, towards pleasure, reward, desire. Its a combination of both.
    Impression of Increased status: People pay more for things that increase the perceived status amongst their peers.
  Sensory Language:
    - Imagination is gateway to the mind.
    - Using Adjective is the key.
    - Using sensory predicates is the key.
    - Visual external / internal
    - Auditory external
    - Feeling external / internal
    - Self talk internal
    Example 1: It's August 15, 1998 — the last day of the county fair. The smell of popcorn and cotton candy fill my nose, as the sounds of merry-go-rounds, circus games and laughing children fill the air. There's an electric charge at the fair as my life is about to take the most astounding turn.
    Example 2:Imagine it's the holidays... you're gathered around with people you love. A game is playing in the background. You can smell the smell of delicious food coming from the kitchen. You feel the love for the people in the room as someone yells that it's time for dinner. As you sit around the table and look at the feast that's laid out in front of you, your eyes begin to scan around the table, taking in the scene with people you love... and your eyes fall on an empty seat. That seat is empty because there was a teenager who was texting while driving. That's someone who will never grow up to graduate high-school or college... never walk down the aisle. I've created an app that prevents that. It saves live by preventing teenage texting while driving.
